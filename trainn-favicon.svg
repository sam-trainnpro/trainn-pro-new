<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Mountain silhouette -->
  <path d="M1 31 L8 18 L12 22 L16 12 L20 16 L24 8 L28 14 L31 31 Z" fill="#FF5A5F"/>
  
  <!-- Person celebrating on peak -->
  <g fill="#000000">
    <!-- Head -->
    <circle cx="16" cy="8" r="1.5"/>
    <!-- Body -->
    <rect x="15.2" y="9.5" width="1.6" height="3" rx="0.8"/>
    <!-- Arms raised up -->
    <rect x="12.5" y="10" width="2" height="0.8" rx="0.4" transform="rotate(-30 13.5 10.4)"/>
    <rect x="17.5" y="10" width="2" height="0.8" rx="0.4" transform="rotate(30 18.5 10.4)"/>
    <!-- Legs -->
    <rect x="14.8" y="12.5" width="0.8" height="2" rx="0.4"/>
    <rect x="16.4" y="12.5" width="0.8" height="2" rx="0.4"/>
  </g>
  
  <!-- Small "T" on mountain -->
  <text x="16" y="28" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">T</text>
</svg>