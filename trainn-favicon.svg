<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient background -->
    <radialGradient id="sunGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFE066;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Circular background with gradient -->
  <circle cx="16" cy="16" r="15" fill="url(#sunGradient)"/>
  
  <!-- Mountain silhouette -->
  <path d="M1 31 L8 22 L12 26 L16 20 L20 24 L24 18 L28 22 L32 31 Z" fill="#4A3A2A"/>
  
  <!-- Person celebrating on peak -->
  <g fill="#2D1810">
    <!-- Head -->
    <circle cx="16" cy="16" r="1.8"/>
    <!-- Body -->
    <rect x="15" y="17.8" width="2" height="4" rx="1"/>
    <!-- Left arm raised -->
    <rect x="12.5" y="18.5" width="2.5" height="1" rx="0.5" transform="rotate(-35 13.75 19)"/>
    <!-- Right arm raised -->
    <rect x="17" y="18.5" width="2.5" height="1" rx="0.5" transform="rotate(35 18.25 19)"/>
    <!-- Left leg -->
    <rect x="14.8" y="21.8" width="1" height="2.5" rx="0.5"/>
    <!-- Right leg -->
    <rect x="16.2" y="21.8" width="1" height="2.5" rx="0.5"/>
  </g>
</svg>